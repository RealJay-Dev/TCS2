<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TCS Admin">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<title>TCS Korea Workplace · Admin</title>
<style>
  :root {
    --bg: #ffffff; --bg-secondary: #f5f5f4; --bg-danger: #fcebeb;
    --bg-success: #eaf3de; --bg-info: #e6f1fb; --bg-warning: #faeeda;
    --text: #1a1a18; --text-secondary: #5f5e5a; --text-tertiary: #888780;
    --text-danger: #a32d2d; --text-success: #3b6d11; --text-info: #185fa5;
    --border: rgba(0,0,0,0.12); --border-strong: rgba(0,0,0,0.25);
    --radius: 12px; --radius-sm: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a; --bg-secondary: #2a2a28; --bg-danger: #501313;
      --bg-success: #173404; --bg-info: #042c53; --bg-warning: #412402;
      --text: #f0ede8; --text-secondary: #b4b2a9; --text-tertiary: #888780;
      --text-danger: #f7c1c1; --text-success: #c0dd97; --text-info: #b5d4f4;
      --border: rgba(255,255,255,0.1); --border-strong: rgba(255,255,255,0.22);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; background: var(--bg-secondary); color: var(--text); min-height: 100vh; }

  /* Auth */
  #authScreen { position: fixed; inset: 0; background: var(--bg-secondary); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .auth-card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 32px 24px; width: 100%; max-width: 360px; }
  .auth-logo { font-size: 13px; font-weight: 600; color: var(--text-tertiary); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 24px; }
  .auth-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .auth-sub { font-size: 14px; color: var(--text-secondary); margin-bottom: 28px; line-height: 1.5; }
  .auth-btn { width: 100%; padding: 14px; background: var(--text); color: var(--bg); border: none; border-radius: var(--radius-sm); font-size: 15px; font-weight: 600; cursor: pointer; }
  .auth-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .auth-status { margin-top: 16px; padding: 12px 14px; border-radius: var(--radius-sm); font-size: 13px; line-height: 1.5; }
  .auth-status.info { background: var(--bg-info); color: var(--text-info); }
  .auth-status.err { background: var(--bg-danger); color: var(--text-danger); }
  .auth-status.ok { background: var(--bg-success); color: var(--text-success); }
  .hidden { display: none; }

  /* Admin UI */
  .header { background: var(--bg); border-bottom: 0.5px solid var(--border); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .header-left { }
  .header-title { font-size: 17px; font-weight: 600; }
  .header-sub { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }
  .logout-btn { background: none; border: 0.5px solid var(--border-strong); border-radius: 20px; color: var(--text-secondary); font-size: 12px; padding: 5px 12px; cursor: pointer; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 20px; }

  /* Stats */
  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat-card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 16px 20px; }
  .stat-label { font-size: 12px; color: var(--text-tertiary); margin-bottom: 6px; }
  .stat-val { font-size: 28px; font-weight: 700; color: var(--text); }
  .stat-sub { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

  /* Filter */
  .filter-row { display: flex; gap: 10px; margin-bottom: 14px; align-items: center; flex-wrap: wrap; }
  .filter-input { padding: 9px 12px; border: 0.5px solid var(--border-strong); border-radius: var(--radius-sm); font-size: 14px; background: var(--bg); color: var(--text); outline: none; }
  .filter-input:focus { border-color: var(--text); }
  .filter-select { padding: 9px 12px; border: 0.5px solid var(--border-strong); border-radius: var(--radius-sm); font-size: 14px; background: var(--bg); color: var(--text); outline: none; cursor: pointer; }
  .refresh-btn { padding: 9px 16px; background: var(--text); color: var(--bg); border: none; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; cursor: pointer; }

  /* Table */
  .table-wrap { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .table-header { display: grid; grid-template-columns: 2fr 1.2fr 1fr 1.2fr; padding: 10px 16px; background: var(--bg-secondary); border-bottom: 0.5px solid var(--border); font-size: 12px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.05em; }
  .table-row { display: grid; grid-template-columns: 2fr 1.2fr 1fr 1.2fr; padding: 12px 16px; border-bottom: 0.5px solid var(--border); font-size: 13px; align-items: center; }
  .table-row:last-child { border-bottom: none; }
  .table-row:hover { background: var(--bg-secondary); }
  .badge-type { display: inline-block; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 20px; }
  .badge-type.new { background: var(--bg-info); color: var(--text-info); }
  .badge-type.auto { background: var(--bg-success); color: var(--text-success); }
  .empty-state { text-align: center; padding: 48px; color: var(--text-tertiary); font-size: 14px; }
  .loading-state { text-align: center; padding: 48px; color: var(--text-secondary); font-size: 14px; }
  .count-info { font-size: 13px; color: var(--text-tertiary); margin-bottom: 10px; }
</style>
</head>
<body>

<!-- Auth -->
<div id="authScreen">
  <div class="auth-card">
    <div class="auth-logo" id="authLogo" onclick="secretClick()" style="cursor:default;user-select:none;">TCS Korea Workplace · Admin</div>
    <div class="auth-title">관리자 로그인</div>
    <div class="auth-sub" id="authSubText">관리자 이메일로 인증 코드를 받아 로그인하세요.</div>
    <div id="emailStep">
      <input type="text" id="emailInput" placeholder="이메일 주소 입력" style="width:100%;padding:12px 14px;border:0.5px solid var(--border-strong);border-radius:var(--radius-sm);font-size:16px;background:var(--bg);color:var(--text);outline:none;margin-bottom:12px;" oninput="onEmailInput()" onkeydown="if(event.key==='Enter') sendOTP()">
      <button class="auth-btn" id="authBtn" onclick="sendOTP()" disabled>인증 코드 받기</button>
    </div>
    <!-- 비밀번호 모드 -->
    <div id="pwStep" class="hidden">
      <input type="password" id="pwInput" placeholder="비밀번호 입력" style="width:100%;padding:12px 14px;border:0.5px solid var(--border-strong);border-radius:var(--radius-sm);font-size:16px;background:var(--bg);color:var(--text);outline:none;margin-bottom:12px;" oninput="onPwInput()" onkeydown="if(event.key==='Enter') loginWithPassword()">
      <button class="auth-btn" id="pwBtn" onclick="loginWithPassword()" disabled>로그인</button>
    </div>
    <div id="otpStep" class="hidden">
      <div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px;" id="otpSentTo"></div>
      <input type="text" id="otpInput" placeholder="6자리 코드 입력" maxlength="6" inputmode="numeric" style="width:100%;padding:12px 14px;border:0.5px solid var(--border-strong);border-radius:var(--radius-sm);font-size:22px;background:var(--bg);color:var(--text);outline:none;margin-bottom:12px;letter-spacing:0.3em;text-align:center;" oninput="onOTPInput()" onkeydown="if(event.key==='Enter') verifyOTP()">
      <button class="auth-btn" id="otpBtn" onclick="verifyOTP()" disabled>확인</button>
      <div style="text-align:center;margin-top:12px;">
        <button onclick="resetAuth()" style="background:none;border:none;color:var(--text-tertiary);font-size:13px;cursor:pointer;text-decoration:underline;">이메일 다시 입력</button>
      </div>
    </div>
    <div id="authStatus" class="hidden auth-status"></div>
  </div>
</div>

<!-- Admin UI -->
<div id="adminApp" class="hidden">
  <div class="header">
    <div class="header-left">
      <div class="header-title">TCS Pro 관리자</div>
      <div class="header-sub" id="adminEmail"></div>
    </div>
    <button class="logout-btn" onclick="logout()">로그아웃</button>
  </div>

  <div style="display:flex; height:calc(100vh - 53px);">
    <!-- 왼쪽 유저 슬라이서 -->
    <div style="width:220px; flex-shrink:0; background:var(--bg); border-right:0.5px solid var(--border); overflow-y:auto; padding:16px 0;">
      <div style="padding:0 16px 10px; font-size:12px; font-weight:600; color:var(--text-tertiary); text-transform:uppercase; letter-spacing:0.05em;">사용자</div>
      <div id="userList"></div>
    </div>

    <!-- 오른쪽 메인 -->
    <div style="flex:1; overflow-y:auto; padding:20px;">
      <!-- Stats -->
      <div class="stats-grid" style="margin-bottom:16px;">
        <div class="stat-card">
          <div class="stat-label">전체 접속</div>
          <div class="stat-val" id="statTotal">—</div>
          <div class="stat-sub">누적 로그 수</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">오늘 접속</div>
          <div class="stat-val" id="statToday">—</div>
          <div class="stat-sub" id="statTodayDate">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">접속 사용자</div>
          <div class="stat-val" id="statUsers">—</div>
          <div class="stat-sub">고유 이메일 수</div>
        </div>
      </div>

      <!-- 탭 -->
      <div style="display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;">
        <button class="search-tab active" id="tab-access" onclick="switchTab('access')" style="flex:none;padding:8px 20px;">접속 로그</button>
        <button class="search-tab" id="tab-action" onclick="switchTab('action')" style="flex:none;padding:8px 20px;">액션 로그</button>
        <button class="search-tab" id="tab-ppmo" onclick="switchTab('ppmo')" style="flex:none;padding:8px 20px;">🚚 PPMo</button>
        <button class="search-tab" id="tab-stats" onclick="switchTab('stats')" style="flex:none;padding:8px 20px;">📊 통계 · KPI</button>
        <button class="search-tab" id="tab-consent" onclick="switchTab('consent')" style="flex:none;padding:8px 20px;">🔒 동의 현황</button>
        <button class="refresh-btn" onclick="loadAll()" style="margin-left:auto;">↻ 새로고침</button>
      </div>

      <!-- 접속 로그 -->
      <div id="panel-access">
        <div style="display:flex;align-items:center;margin-bottom:8px;">
          <div class="count-info" id="countInfo" style="margin-bottom:0;flex:1;"></div>
          <button onclick="exportAccessCSV()" style="padding:5px 12px;background:none;border:0.5px solid var(--border-strong);border-radius:var(--radius-sm);font-size:12px;color:var(--text-secondary);cursor:pointer;">📥 CSV</button>
        </div>
        <div class="table-wrap">
          <div class="table-header" style="grid-template-columns:2fr 1.2fr 1fr 1fr 1fr;">
            <div>이메일</div><div>접속 시각</div><div>유형</div><div>기기</div><div>지역</div>
          </div>
          <div id="logTable"><div class="loading-state">로딩 중...</div></div>
        </div>
      </div>

      <!-- 액션 로그 -->
      <div id="panel-action" class="hidden">
        <div style="display:flex;align-items:center;margin-bottom:8px;">
          <div class="count-info" id="actionCountInfo" style="margin-bottom:0;flex:1;"></div>
          <button onclick="exportActionCSV()" style="padding:5px 12px;background:none;border:0.5px solid var(--border-strong);border-radius:var(--radius-sm);font-size:12px;color:var(--text-secondary);cursor:pointer;">📥 CSV</button>
        </div>
        <div class="table-wrap">
          <div class="table-header" style="grid-template-columns:1.5fr 1.5fr 1fr 0.8fr 0.8fr 1fr 1fr 1fr;">
            <div>이메일</div><div>아티클</div><div>패턴</div><div>RTD</div><div>결과%</div><div>보상금액</div><div>지역</div><div>시각</div>
          </div>
          <div id="actionTable"><div class="loading-state">로딩 중...</div></div>
        </div>
      </div>

      <!-- 통계 / KPI -->
      <div id="panel-stats" class="hidden">
        <div id="statsPanel"><div class="loading-state">로딩 중...</div></div>
      </div>

      <!-- PPMo -->
      <div id="panel-ppmo" class="hidden">
        <div id="ppmoStats" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px;"></div>
        <div style="display:flex;gap:10px;margin-bottom:10px;align-items:center;flex-wrap:wrap;">
          <select id="ppmoFilterSales" onchange="renderPpmoTable()" style="padding:7px 10px;border:0.5px solid var(--border-strong);border-radius:var(--radius-sm);font-size:13px;background:var(--bg);color:var(--text);min-width:180px;">
            <option value="">전체 담당자</option>
          </select>
          <select id="ppmoFilterStatus" onchange="renderPpmoTable()" style="padding:7px 10px;border:0.5px solid var(--border-strong);border-radius:var(--radius-sm);font-size:13px;background:var(--bg);color:var(--text);">
            <option value="">전체 상태</option>
            <option value="in_progress">진행중 (미완료)</option>
            <option value="complete">완료 (6/6)</option>
          </select>
          <div class="count-info" id="ppmoCountInfo" style="margin:0;"></div>
          <button onclick="exportPpmoCSV()" style="margin-left:auto;padding:5px 12px;background:none;border:0.5px solid var(--border-strong);border-radius:var(--radius-sm);font-size:12px;color:var(--text-secondary);cursor:pointer;">📥 CSV</button>
        </div>
        <div class="table-wrap">
          <div class="table-header" style="grid-template-columns:1.2fr 1.6fr 1.4fr 0.8fr 1fr 1fr 0.6fr;">
            <div>차량번호</div><div>담당자</div><div>모델 · 연식</div><div>진행</div><div>최근 검사일</div><div>등록일</div><div>액션</div>
          </div>
          <div id="ppmoTable"><div class="loading-state">로딩 중...</div></div>
        </div>
      </div>

      <!-- 동의 현황 -->
      <div id="panel-consent" class="hidden">
        <div style="display:flex;align-items:center;margin-bottom:8px;">
          <div class="count-info" id="consentCountInfo" style="margin-bottom:0;flex:1;"></div>
          <button onclick="exportConsentCSV()" style="padding:5px 12px;background:none;border:0.5px solid var(--border-strong);border-radius:var(--radius-sm);font-size:12px;color:var(--text-secondary);cursor:pointer;">📥 CSV</button>
        </div>
        <div class="table-wrap">
          <div class="table-header" style="grid-template-columns:2fr 1.2fr 1fr 1.2fr 0.8fr 0.8fr;">
            <div>이메일</div><div>성명</div><div>사번</div><div>동의 시각</div><div>PDF</div><div>동의 철회</div>
          </div>
          <div id="consentTable"><div class="loading-state">로딩 중...</div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://thosddtgtffapakvmrhn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_HmrBU9WFhkCTM_TquLM31g_IPovXtXm';
const ADMIN_EMAILS = ['jaehong.park@continental.com', 'sangyong.2.jung@continental.com'];

const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true }
});

let allLogs = [], allActions = [], allSessions = [], allConsents = [], selectedUser = null, currentTab = 'access';
let ppmoVehicles = [], ppmoRounds = [], ppmoLoaded = false;
const bannedUsers = new Set();
const excludedFromKPI = new Set();

// ── Secret mode (logo 5번 클릭, 관리자 이메일 입력 후) ───────
let _secretClicks = 0, _secretTimer = null, _pwMode = false;
window.secretClick = function() {
  const email = document.getElementById('emailInput').value.trim().toLowerCase();
  if (!ADMIN_EMAILS.includes(email)) return;
  _secretClicks++;
  if (_secretTimer) clearTimeout(_secretTimer);
  _secretTimer = setTimeout(() => { _secretClicks = 0; }, 2000);
  if (_secretClicks >= 5) {
    _secretClicks = 0;
    _pwMode = !_pwMode;
    document.getElementById('emailStep').classList.toggle('hidden', _pwMode);
    document.getElementById('pwStep').classList.toggle('hidden', !_pwMode);
    document.getElementById('otpStep').classList.add('hidden');
    document.getElementById('authStatus').classList.add('hidden');
    document.getElementById('authSubText').textContent = _pwMode
      ? '비밀번호로 로그인합니다.'
      : '관리자 이메일로 인증 코드를 받아 로그인하세요.';
    if (_pwMode) document.getElementById('pwInput').focus();
  }
};
window.onPwInput = function() {
  document.getElementById('pwBtn').disabled = document.getElementById('pwInput').value.trim().length < 1;
};
window.loginWithPassword = async function() {
  const btn = document.getElementById('pwBtn');
  const email = document.getElementById('emailInput').value.trim().toLowerCase();
  if (!ADMIN_EMAILS.includes(email)) { showAuthError('관리자 계정만 접근 가능합니다.'); return; }
  btn.disabled = true; btn.textContent = '로그인 중...';
  try {
    const { data, error } = await _supabase.auth.signInWithPassword({
      email,
      password: document.getElementById('pwInput').value.trim()
    });
    if (error) throw error;
    showAdmin(data.user.email);
  } catch(e) {
    showAuthError('비밀번호가 올바르지 않습니다.');
    btn.disabled = false; btn.textContent = '로그인';
  }
};

// 페이지 로드 시 세션 확인
(async () => {
  const { data: { session } } = await _supabase.auth.getSession();
  if (session && ADMIN_EMAILS.includes(session.user.email.toLowerCase())) {
    showAdmin(session.user.email);
  } else {
    document.getElementById('authScreen').style.display = 'flex';
  }
})();

function showAdmin(email) {
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('adminApp').classList.remove('hidden');
  document.getElementById('adminEmail').textContent = email;
  loadAll();
}

function showAuthError(msg) {
  const el = document.getElementById('authStatus');
  el.className = 'auth-status err';
  el.textContent = msg;
  el.classList.remove('hidden');
}

function resetAuth() {
  document.getElementById('emailStep').classList.remove('hidden');
  document.getElementById('otpStep').classList.add('hidden');
  document.getElementById('authStatus').classList.add('hidden');
  document.getElementById('emailInput').value = '';
  document.getElementById('otpInput').value = '';
  document.getElementById('authBtn').disabled = true;
}

window.onEmailInput = function() {
  document.getElementById('authBtn').disabled = !document.getElementById('emailInput').value.trim().includes('@');
};
window.onOTPInput = function() {
  document.getElementById('otpBtn').disabled = document.getElementById('otpInput').value.trim().length !== 6;
};
window.sendOTP = async function() {
  const email = document.getElementById('emailInput').value.trim();
  if (!ADMIN_EMAILS.includes(email.toLowerCase())) { showAuthError('관리자 계정만 접근 가능합니다.'); return; }
  const btn = document.getElementById('authBtn');
  btn.disabled = true; btn.textContent = '전송 중...';
  try {
    const { error } = await _supabase.auth.signInWithOtp({ email, options: { shouldCreateUser: true, emailRedirectTo: null } });
    if (error) throw error;
    document.getElementById('emailStep').classList.add('hidden');
    document.getElementById('otpStep').classList.remove('hidden');
    document.getElementById('otpSentTo').textContent = `${email} 으로 6자리 코드를 보냈습니다`;
    document.getElementById('authStatus').classList.add('hidden');
    document.getElementById('otpInput').focus();
  } catch(e) {
    showAuthError('전송 실패: ' + e.message);
    btn.disabled = false; btn.textContent = '인증 코드 받기';
  }
};
window.verifyOTP = async function() {
  const email = document.getElementById('emailInput').value.trim();
  const token = document.getElementById('otpInput').value.trim();
  const btn = document.getElementById('otpBtn');
  btn.disabled = true; btn.textContent = '확인 중...';
  try {
    const { data, error } = await _supabase.auth.verifyOtp({ email, token, type: 'email' });
    if (error) throw error;
    if (!ADMIN_EMAILS.includes(data.user.email.toLowerCase())) {
      await _supabase.auth.signOut();
      showAuthError('관리자 계정만 접근 가능합니다.');
      btn.disabled = false; btn.textContent = '확인'; return;
    }
    showAdmin(data.user.email);
  } catch(e) {
    showAuthError('코드가 올바르지 않거나 만료되었습니다.');
    btn.disabled = false; btn.textContent = '확인';
  }
};
window.logout = async function() { await _supabase.auth.signOut(); location.reload(); };
window.resetAuth = resetAuth;

// ── Tab ───────────────────────────────────────────────────────
window.switchTab = function(tab) {
  currentTab = tab;
  ['access','action','ppmo','stats','consent'].forEach(t => {
    document.getElementById(`tab-${t}`).classList.toggle('active', t === tab);
    document.getElementById(`panel-${t}`).classList.toggle('hidden', t !== tab);
  });
  if (tab === 'access') renderAccessLogs();
  else if (tab === 'action') renderActionLogs();
  else if (tab === 'ppmo') { if (!ppmoLoaded) loadPpmoData(); else renderPpmoTable(); }
  else if (tab === 'consent') renderConsentLogs();
  else renderStats();
};

// ── Load all ──────────────────────────────────────────────────
window.loadAll = async function() {
  document.getElementById('logTable').innerHTML = '<div class="loading-state">로딩 중...</div>';
  document.getElementById('actionTable').innerHTML = '<div class="loading-state">로딩 중...</div>';
  try {
    const [accessRes, actionRes, sessionRes, consentRes] = await Promise.all([
      _supabase.from('access_logs').select('*').order('created_at', { ascending: false }).limit(500),
      _supabase.from('action_logs').select('*').order('created_at', { ascending: false }).limit(500),
      _supabase.from('sessions').select('*').order('session_start', { ascending: false }).limit(500),
      _supabase.from('consent_logs').select('*').order('consented_at', { ascending: false })
    ]);
    allConsents = consentRes.error ? [] : consentRes.data;
    if (accessRes.error) throw accessRes.error;
    if (actionRes.error) throw actionRes.error;
    allLogs = accessRes.data.filter(l => l.email !== 'system@ping.internal');
    allActions = actionRes.data;
    allSessions = (sessionRes.error ? [] : sessionRes.data).filter(s => s.email !== 'system@ping.internal');

    // banned users 로드
    const bannedRes = await _supabase.from('banned_users').select('email');
    if (!bannedRes.error) {
      bannedUsers.clear();
      bannedRes.data.forEach(b => bannedUsers.add(b.email));
    }
    updateStats();
    renderUserList();
    renderAccessLogs();
    renderActionLogs();
    await loadSettings();
  } catch(e) {
    document.getElementById('logTable').innerHTML = `<div class="empty-state">오류: ${e.message}</div>`;
  }
};

// ── User list (slicer) with Ban ───────────────────────────────
function renderUserList() {
  const users = [...new Set(allLogs.map(l => l.email).filter(Boolean))].sort();
  const activeUsers = users.filter(u => !bannedUsers.has(u));
  const banned = users.filter(u => bannedUsers.has(u));
  const ul = document.getElementById('userList');

  let html = `
    <div style="padding:8px 16px 4px;font-size:11px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.05em;">KPI 포함 여부</div>
    <div onclick="selectUser(null)" style="padding:8px 16px;font-size:13px;cursor:pointer;color:${!selectedUser?'var(--text)':'var(--text-secondary)'};font-weight:${!selectedUser?'600':'400'};border-left:3px solid ${!selectedUser?'var(--text)':'transparent'};">전체 (${activeUsers.length}명)</div>`;

  activeUsers.forEach(u => {
    const cnt = allLogs.filter(l => l.email === u).length;
    const isSelected = selectedUser === u;
    const isExcluded = excludedFromKPI.has(u);
    html += `
      <div style="border-left:3px solid ${isSelected?'var(--text)':'transparent'};">
        <div style="padding:8px 16px 2px;display:flex;align-items:flex-start;gap:8px;">
          <input type="checkbox" ${isExcluded?'':'checked'} onchange="toggleKPI('${u}', this.checked)" style="margin-top:2px;flex-shrink:0;cursor:pointer;" title="KPI에 포함">
          <div onclick="selectUser('${u}')" style="font-size:12px;cursor:pointer;color:${isSelected?'var(--text)':'var(--text-secondary)'};font-weight:${isSelected?'600':'400'};word-break:break-all;line-height:1.4;${isExcluded?'opacity:0.4;':''}">
            ${u}
            <span style="display:block;font-size:11px;color:var(--text-tertiary);">${cnt}회 접속</span>
          </div>
        </div>
        <div style="padding:0 16px 8px;">
          <button onclick="toggleBan('${u}', false)" style="font-size:11px;padding:2px 8px;border-radius:20px;border:0.5px solid var(--text-danger);background:none;color:var(--text-danger);cursor:pointer;">Ban</button>
        </div>
      </div>`;
  });

  if (banned.length > 0) {
    html += `<div style="margin:12px 16px 6px;font-size:11px;font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.05em;border-top:0.5px solid var(--border);padding-top:12px;">🚫 Banned (${banned.length})</div>`;
    banned.forEach(u => {
      const cnt = allLogs.filter(l => l.email === u).length;
      html += `
        <div style="opacity:0.5;border-left:3px solid transparent;">
          <div style="padding:8px 16px 4px;font-size:12px;color:var(--text-tertiary);word-break:break-all;line-height:1.4;">
            ${u}<span style="display:block;font-size:11px;">${cnt}회 접속</span>
          </div>
          <div style="padding:0 16px 8px;">
            <button onclick="toggleBan('${u}', true)" style="font-size:11px;padding:2px 8px;border-radius:20px;border:0.5px solid var(--text-success);background:none;color:var(--text-success);cursor:pointer;">Ban 해제</button>
          </div>
        </div>`;
    });
  }
  ul.innerHTML = html;
}

window.toggleKPI = function(email, included) {
  if (included) excludedFromKPI.delete(email);
  else excludedFromKPI.add(email);
  renderUserList();
  if (currentTab === 'stats') renderStats();
};

window.toggleBan = async function(email, isBanned) {
  if (!confirm(`${email} 을 ${isBanned?'Ban 해제':'Ban'} 하시겠습니까?`)) return;
  if (isBanned) {
    bannedUsers.delete(email);
  } else {
    bannedUsers.add(email);
  }
  // Supabase Auth에서 직접 ban은 Admin API 필요 — 여기선 banned_users 테이블로 관리
  try {
    if (isBanned) {
      await _supabase.from('banned_users').delete().eq('email', email);
    } else {
      await _supabase.from('banned_users').insert({ email });
    }
  } catch(e) { console.warn('Ban 처리 실패 (테이블 없을 수 있음):', e); }
  renderUserList();
};

window.selectUser = function(user) {
  selectedUser = user;
  renderUserList();
  renderAccessLogs();
  renderActionLogs();
  if (currentTab === 'stats') renderStats();
};

window.exportActionCSV = function() {
  const base = allActions.filter(l => !excludedFromKPI.has(l.email));
  const data = selectedUser ? base.filter(l => l.email === selectedUser) : base;
  const rows = [['이메일', '아티클', '패턴', '사이즈', 'RTD', '결과%', '보상금액', '지역', '시각']];
  data.forEach(l => {
    const ts = l.created_at ? new Date(l.created_at).toLocaleString('ko-KR') : '—';
    const credit = l.credit_amt != null ? Math.round(l.credit_amt) : '—';
    rows.push([l.email||'—', l.article||'—', l.pattern||'—', l.size||'—', l.rtd!=null?l.rtd+'mm':'—', l.result_pct!=null?l.result_pct+'%':'—', credit, l.location||'—', ts]);
  });
  downloadCSV(rows, `TCS_Action_Log_${new Date().toISOString().slice(0,10)}.csv`);
};

function downloadCSV(rows, filename) {
  const csv = rows.map(r => r.map(c => `"${c}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

// ── Stats / KPI ───────────────────────────────────────────────
let MINS_SAVED_PER_CALC = 2;

// 설정값 로드
async function loadSettings() {
  try {
    const { data } = await _supabase.from('settings').select('*');
    if (data) {
      data.forEach(s => {
        if (s.key === 'mins_saved_per_calc') MINS_SAVED_PER_CALC = parseInt(s.value) || 2;
      });
    }
  } catch(e) { console.warn('설정 로드 실패:', e); }
}

function renderStats() {
  const kpiActions = allActions.filter(a => !excludedFromKPI.has(a.email));
  const kpiSessions = allSessions.filter(s => !excludedFromKPI.has(s.email));

  const sessions = selectedUser ? kpiSessions.filter(s => s.email === selectedUser) : kpiSessions;
  const actions = selectedUser ? kpiActions.filter(a => a.email === selectedUser) : kpiActions;
  const users = [...new Set(allLogs.map(l => l.email).filter(Boolean))].filter(u => !excludedFromKPI.has(u));

  const totalCalcs = actions.filter(a => a.action_type === '보상계산').length;
  const totalPriceOnly = actions.filter(a => a.action_type === '가격조회').length;
  const totalTimeSaved = totalCalcs * MINS_SAVED_PER_CALC;
  const totalSessions = sessions.length;
  const avgDuration = sessions.length > 0 ? sessions.reduce((sum, s) => {
    if (!s.session_start || !s.last_seen) return sum;
    return sum + (new Date(s.last_seen) - new Date(s.session_start)) / 60000;
  }, 0) / sessions.length : 0;

  const userStats = users.map(u => {
    const uSessions = kpiSessions.filter(s => s.email === u);
    const uActions = kpiActions.filter(a => a.email === u);
    const uCalcs = uActions.filter(a => a.action_type === '보상계산').length;
    const uPriceOnly = uActions.filter(a => a.action_type === '가격조회').length;
    const uTimeSaved = uCalcs * MINS_SAVED_PER_CALC;
    const uAvgDur = uSessions.length > 0 ? uSessions.reduce((sum, s) => {
      if (!s.session_start || !s.last_seen) return sum;
      return sum + (new Date(s.last_seen) - new Date(s.session_start)) / 60000;
    }, 0) / uSessions.length : 0;
    const days = new Set(uSessions.map(s => s.session_start?.slice(0,10))).size || 1;
    const dailyAvg = (uSessions.length / days).toFixed(1);
    return { email: u, sessions: uSessions.length, calcs: uCalcs, priceOnly: uPriceOnly, timeSaved: uTimeSaved, avgDur: uAvgDur, dailyAvg };
  }).filter(u => !selectedUser || u.email === selectedUser);

  const el = document.getElementById('statsPanel');
  el.innerHTML = `
    <!-- 절약 시간 설정 -->
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;padding:12px 16px;background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-sm);">
      <span style="font-size:13px;color:var(--text-secondary);">계산 1회당 절약 시간:</span>
      <input type="number" id="minsInput" value="${MINS_SAVED_PER_CALC}" min="1" max="60" style="width:60px;padding:6px 10px;border:0.5px solid var(--border-strong);border-radius:var(--radius-sm);font-size:14px;background:var(--bg);color:var(--text);">
      <span style="font-size:13px;color:var(--text-secondary);">분</span>
      <button onclick="updateMins()" style="padding:6px 14px;background:var(--text);color:var(--bg);border:none;border-radius:var(--radius-sm);font-size:13px;cursor:pointer;">적용</button>
      <span style="font-size:11px;color:var(--text-tertiary);margin-left:8px;">※ KPI 제외된 유저는 통계에서 제외됩니다</span>
      <div style="margin-left:auto;display:flex;gap:8px;">
        <button onclick="exportCSV()" style="padding:6px 14px;background:none;border:0.5px solid var(--border-strong);border-radius:var(--radius-sm);font-size:13px;color:var(--text-secondary);cursor:pointer;">📥 CSV</button>
        <button onclick="exportPDF()" style="padding:6px 14px;background:none;border:0.5px solid var(--border-strong);border-radius:var(--radius-sm);font-size:13px;color:var(--text-secondary);cursor:pointer;">🖨️ PDF</button>
      </div>
    </div>
    <!-- 전체 KPI -->
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px;">
      <div class="stat-card"><div class="stat-label">보상계산 횟수</div><div class="stat-val">${totalCalcs}</div><div class="stat-sub">누적</div></div>
      <div class="stat-card"><div class="stat-label">가격조회만</div><div class="stat-val" style="color:var(--text-danger);">${totalPriceOnly}</div><div class="stat-sub">보상계산 없이 종료</div></div>
      <div class="stat-card"><div class="stat-label">절약 시간</div><div class="stat-val">${totalTimeSaved}분</div><div class="stat-sub">계산 1회 = ${MINS_SAVED_PER_CALC}분</div></div>
      <div class="stat-card"><div class="stat-label">총 세션</div><div class="stat-val">${totalSessions}</div><div class="stat-sub">누적</div></div>
      <div class="stat-card"><div class="stat-label">평균 세션 시간</div><div class="stat-val">${avgDuration.toFixed(1)}분</div><div class="stat-sub">포그라운드 기준</div></div>
    </div>
    <!-- 유저별 테이블 -->
    <div class="table-wrap">
      <div class="table-header" style="grid-template-columns:2fr 1fr 1fr 1fr 1fr 1fr 1fr;">
        <div>이메일</div><div>총 접속</div><div>일평균</div><div>평균 세션</div><div>보상계산</div><div>가격조회만</div><div>절약 시간</div>
      </div>
      ${userStats.map(u => `
        <div class="table-row" style="grid-template-columns:2fr 1fr 1fr 1fr 1fr 1fr 1fr;">
          <div style="font-size:13px;font-weight:500;">${u.email}</div>
          <div style="font-size:13px;">${u.sessions}회</div>
          <div style="font-size:13px;">${u.dailyAvg}회/일</div>
          <div style="font-size:13px;">${u.avgDur.toFixed(1)}분</div>
          <div style="font-size:13px;font-weight:600;">${u.calcs}회</div>
          <div style="font-size:13px;color:${u.priceOnly>0?'var(--text-danger)':'var(--text-tertiary)'};">${u.priceOnly}회</div>
          <div style="font-size:13px;color:var(--text-success);font-weight:600;">${u.timeSaved}분</div>
        </div>`).join('')}
    </div>`;
}

window.updateMins = async function() {
  const val = parseInt(document.getElementById('minsInput').value);
  if (isNaN(val) || val < 1) return;
  MINS_SAVED_PER_CALC = val;
  try {
    await _supabase.from('settings').upsert({ key: 'mins_saved_per_calc', value: String(val), updated_at: new Date().toISOString() });
  } catch(e) { console.warn('설정 저장 실패:', e); }
  renderStats();
};

// ── Export ────────────────────────────────────────────────────
window.exportCSV = function() {
  const kpiActions = allActions.filter(a => !excludedFromKPI.has(a.email));
  const kpiSessions = allSessions.filter(s => !excludedFromKPI.has(s.email));
  const users = [...new Set(allLogs.map(l => l.email).filter(Boolean))].filter(u => !excludedFromKPI.has(u));

  const rows = [['이메일', '총 접속', '일평균 접속', '평균 세션(분)', '보상계산 횟수', '가격조회만', '절약 시간(분)']];
  users.forEach(u => {
    const uSessions = kpiSessions.filter(s => s.email === u);
    const uActions = kpiActions.filter(a => a.email === u);
    const uCalcs = uActions.filter(a => a.action_type === '보상계산').length;
    const uPriceOnly = uActions.filter(a => a.action_type === '가격조회').length;
    const uTimeSaved = uCalcs * MINS_SAVED_PER_CALC;
    const uAvgDur = uSessions.length > 0 ? (uSessions.reduce((sum, s) => {
      if (!s.session_start || !s.last_seen) return sum;
      return sum + (new Date(s.last_seen) - new Date(s.session_start)) / 60000;
    }, 0) / uSessions.length).toFixed(1) : 0;
    const days = new Set(uSessions.map(s => s.session_start?.slice(0,10))).size || 1;
    const dailyAvg = (uSessions.length / days).toFixed(1);
    rows.push([u, uSessions.length, dailyAvg, uAvgDur, uCalcs, uPriceOnly, uTimeSaved]);
  });

  downloadCSV(rows, `TCS_KPI_${new Date().toISOString().slice(0,10)}.csv`);
};


// ── Consent Records ───────────────────────────────────────────
async function renderConsentLogs() {
  const activeCount = allConsents.filter(c => !c.revoked_at).length;
  const revokedCount = allConsents.filter(c => c.revoked_at).length;
  document.getElementById('consentCountInfo').textContent = `${activeCount}건 활성 / ${revokedCount}건 철회됨 (전체 ${allConsents.length}건)`;
  if (!allConsents.length) {
    document.getElementById('consentTable').innerHTML = '<div class="empty-state">동의 기록 없음</div>';
    return;
  }
  document.getElementById('consentTable').innerHTML = allConsents.map(c => {
    const ts = c.consented_at ? new Date(c.consented_at).toLocaleString('ko-KR') : '—';
    const isRevoked = !!c.revoked_at;
    const rowStyle = isRevoked ? 'opacity:0.5;' : '';
    const revokeBtn = isRevoked
      ? `<span style="font-size:11px;color:var(--text-danger);font-weight:600;padding:4px 10px;background:var(--bg-danger);border-radius:6px;display:inline-block;">철회됨</span>`
      : `<button onclick="revokeConsent('${c.id}','${c.email}')" style="padding:4px 10px;background:var(--bg-danger);border:none;border-radius:6px;font-size:11px;color:var(--text-danger);cursor:pointer;font-weight:600;">철회</button>`;

    await _supabase.from('consent_logs').update({ revoked_at: new Date().toISOString() }).eq('id', id);
    await _supabase.from('consent_revoked').upsert({ email, revoked_at: new Date().toISOString() });

    const target = allConsents.find(c => c.id === id);

    renderConsentLogs();
  } catch(e) {
    alert('오류가 발생했습니다: ' + e.message);
  }
};

// ═══════════════════════════════════════════════════════════════
// PPMo 관리 (담당자별 현황, 차량 삭제, 상세 조회)
// ═══════════════════════════════════════════════════════════════
const TOTAL_PPMO_ROUNDS = 6; // 0(초기) + 1~5

async function loadPpmoData() {
  document.getElementById('ppmoTable').innerHTML = '<div class="loading-state">로딩 중...</div>';
  try {
    const [vRes, rRes] = await Promise.all([
      _supabase.from('ppmo_vehicles').select('*').order('created_at', { ascending: false }),
      _supabase.from('ppmo_rounds').select('id, vehicle_id, round_no, inspected_at, mileage_km')
    ]);
    if (vRes.error) throw vRes.error;
    ppmoVehicles = vRes.data || [];
    ppmoRounds = rRes.error ? [] : (rRes.data || []);
    ppmoLoaded = true;
    // 담당자 필터 옵션 채우기
    const sales = [...new Set(ppmoVehicles.map(v => v.created_by).filter(Boolean))].sort();
    const sel = document.getElementById('ppmoFilterSales');
    const currentVal = sel.value;
    sel.innerHTML = '<option value="">전체 담당자 (' + sales.length + '명)</option>' +
      sales.map(s => `<option value="${escapeAttr(s)}">${escapeHtmlAdm(s)}</option>`).join('');
    if (sales.includes(currentVal)) sel.value = currentVal;
    renderPpmoStats();
    renderPpmoTable();
  } catch(e) {
    document.getElementById('ppmoTable').innerHTML = `<div class="empty-state">로드 실패: ${e.message}</div>`;
  }
}

function renderPpmoStats() {
  const totalVehicles = ppmoVehicles.length;
  const uniqueSales = new Set(ppmoVehicles.map(v => v.created_by).filter(Boolean)).size;
  const totalRounds = ppmoRounds.length;
  // 평균 진행률
  const progressPerVehicle = {};
  ppmoRounds.forEach(r => { progressPerVehicle[r.vehicle_id] = (progressPerVehicle[r.vehicle_id] || 0) + 1; });
  const avgProgress = totalVehicles ? (Object.values(progressPerVehicle).reduce((a,b) => a+b, 0) / totalVehicles) : 0;
  const completeCount = Object.values(progressPerVehicle).filter(n => n >= TOTAL_PPMO_ROUNDS).length;

  document.getElementById('ppmoStats').innerHTML = `
    <div class="stat-card"><div class="stat-num">${totalVehicles}</div><div class="stat-sub">총 차량 수</div></div>
    <div class="stat-card"><div class="stat-num">${uniqueSales}</div><div class="stat-sub">담당자 수</div></div>
    <div class="stat-card"><div class="stat-num">${totalRounds}</div><div class="stat-sub">총 회차 기록</div></div>
    <div class="stat-card"><div class="stat-num">${avgProgress.toFixed(1)}/${TOTAL_PPMO_ROUNDS}</div><div class="stat-sub">평균 진행률</div></div>
    <div class="stat-card"><div class="stat-num">${completeCount}</div><div class="stat-sub">완료 차량 (6/6)</div></div>`;
}

function renderPpmoTable() {
  const salesFilter = document.getElementById('ppmoFilterSales').value;
  const statusFilter = document.getElementById('ppmoFilterStatus').value;
  const progressMap = {};
  const lastDateMap = {};
  ppmoRounds.forEach(r => {
    progressMap[r.vehicle_id] = (progressMap[r.vehicle_id] || 0) + 1;
    const t = r.inspected_at ? new Date(r.inspected_at).getTime() : 0;
    if (!lastDateMap[r.vehicle_id] || t > lastDateMap[r.vehicle_id]) lastDateMap[r.vehicle_id] = t;
  });
  let filtered = ppmoVehicles.filter(v => !salesFilter || v.created_by === salesFilter);
  if (statusFilter === 'in_progress') filtered = filtered.filter(v => (progressMap[v.id] || 0) < TOTAL_PPMO_ROUNDS);
  else if (statusFilter === 'complete') filtered = filtered.filter(v => (progressMap[v.id] || 0) >= TOTAL_PPMO_ROUNDS);

  document.getElementById('ppmoCountInfo').textContent = `${filtered.length}대 표시`;

  if (!filtered.length) {
    document.getElementById('ppmoTable').innerHTML = '<div class="empty-state">해당 조건의 차량이 없습니다.</div>';
    return;
  }

  document.getElementById('ppmoTable').innerHTML = filtered.map(v => {
    const done = progressMap[v.id] || 0;
    const pct = Math.round((done / TOTAL_PPMO_ROUNDS) * 100);
    const progressBar = `<div style="display:flex;align-items:center;gap:6px;font-size:12px;"><div style="flex:1;height:6px;background:var(--bg-secondary);border-radius:3px;overflow:hidden;"><div style="width:${pct}%;height:100%;background:${done >= TOTAL_PPMO_ROUNDS ? 'var(--text-success)' : 'var(--text-info)'};"></div></div><span style="font-weight:600;min-width:28px;">${done}/${TOTAL_PPMO_ROUNDS}</span></div>`;
    const lastDate = lastDateMap[v.id] ? new Date(lastDateMap[v.id]).toLocaleDateString('ko-KR') : '—';
    const createDate = v.created_at ? new Date(v.created_at).toLocaleDateString('ko-KR') : '—';
    const model = [v.vehicle_type, v.model_year && `'${String(v.model_year).slice(-2)}`].filter(Boolean).join(' ') || '—';
    return `<div class="table-row" style="grid-template-columns:1.2fr 1.6fr 1.4fr 0.8fr 1fr 1fr 0.6fr;">
      <div style="font-weight:700;cursor:pointer;color:var(--text-info);" onclick="showPpmoDetail('${v.id}')">${escapeHtmlAdm(v.vehicle_no)}</div>
      <div style="font-size:12px;color:var(--text-secondary);">${escapeHtmlAdm(v.created_by || '—')}</div>
      <div style="font-size:12px;">${escapeHtmlAdm(model)}</div>
      <div>${progressBar}</div>
      <div style="font-size:12px;color:var(--text-secondary);">${lastDate}</div>
      <div style="font-size:12px;color:var(--text-secondary);">${createDate}</div>
      <div><button onclick="deletePpmoVehicle('${v.id}', '${escapeAttr(v.vehicle_no)}')" style="padding:4px 8px;background:none;border:0.5px solid var(--text-danger);border-radius:4px;color:var(--text-danger);font-size:11px;cursor:pointer;">삭제</button></div>
    </div>`;
  }).join('');
}

window.showPpmoDetail = async function(vehicleId) {
  const v = ppmoVehicles.find(x => x.id === vehicleId);
  if (!v) return;
  const modal = document.getElementById('ppmoDetailModal');
  modal.style.display = 'flex';
  modal.classList.remove('hidden');
  document.getElementById('ppmoDetailTitle').textContent = `${v.vehicle_no} · ${v.vehicle_type || ''}`;
  document.getElementById('ppmoDetailContent').innerHTML = '<div class="loading-state">회차 데이터 로딩 중...</div>';
  try {
    const roundIds = ppmoRounds.filter(r => r.vehicle_id === vehicleId).map(r => r.id);
    let measurements = [], photos = [], feedback = [], fullRounds = [];
    const [rRes] = await Promise.all([
      _supabase.from('ppmo_rounds').select('*').eq('vehicle_id', vehicleId).order('round_no')
    ]);
    fullRounds = rRes.data || [];
    if (roundIds.length) {
      const [m, p, f] = await Promise.all([
        _supabase.from('ppmo_measurements').select('*').in('round_id', roundIds),
        _supabase.from('ppmo_photos').select('*').in('round_id', roundIds),
        _supabase.from('ppmo_feedback').select('*').in('round_id', roundIds)
      ]);
      measurements = m.data || [];
      photos = p.data || [];
      feedback = f.data || [];
    }
    // 차량 정보 요약
    const info = [
      ['차량번호', v.vehicle_no],
      ['담당자', v.created_by],
      ['모델·연식', [v.vehicle_type, v.model_year && `${v.model_year}년식`].filter(Boolean).join(' · ') || '—'],
      ['제품', v.product || '—'],
      ['타이어 사이즈', v.tire_size ? `${v.tire_size} ${v.load_index || ''}${v.speed_index || ''}` : '—'],
      ['딜러', v.dealer_name || '—'],
      ['장착 시점 주행거리', v.initial_mileage_km != null ? Number(v.initial_mileage_km).toLocaleString('ko-KR') + ' km' : '—'],
      ['등록일', v.created_at ? new Date(v.created_at).toLocaleString('ko-KR') : '—']
    ];
    const infoHtml = `<div style="background:var(--bg-secondary);border-radius:8px;padding:12px 14px;margin-bottom:14px;font-size:13px;">${
      info.map(([k, val]) => `<div style="display:flex;padding:3px 0;"><span style="color:var(--text-tertiary);min-width:120px;">${k}</span><span>${escapeHtmlAdm(val)}</span></div>`).join('')
    }</div>`;

    // 회차별 요약
    let roundsHtml = '<div style="font-size:12px;font-weight:700;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;">회차별 기록</div>';
    for (let n = 0; n < TOTAL_PPMO_ROUNDS; n++) {
      const r = fullRounds.find(x => x.round_no === n);
      const title = n === 0 ? '초기 설치' : `${n}회차`;
      if (!r) {
        roundsHtml += `<div style="padding:10px 12px;margin-bottom:6px;border:0.5px dashed var(--border-strong);border-radius:8px;font-size:13px;color:var(--text-tertiary);">${title} · 미입력</div>`;
        continue;
      }
      const rMeas = measurements.filter(m => m.round_id === r.id);
      const rPhotos = photos.filter(p => p.round_id === r.id);
      const rFeed = feedback.filter(f => f.round_id === r.id);
      // 포지션별 min RTD
      const minByPos = {};
      rMeas.forEach(m => { if (minByPos[m.position] == null || m.rtd_mm < minByPos[m.position]) minByPos[m.position] = m.rtd_mm; });
      const rtdSummary = Object.entries(minByPos).map(([pos, mm]) => `${pos}: ${mm.toFixed(1)}`).join(' · ') || '—';
      const feedbackTags = rFeed.map(f => `<span style="display:inline-block;background:var(--bg-info);color:var(--text-info);padding:1px 7px;border-radius:8px;font-size:11px;margin-right:3px;">${escapeHtmlAdm(f.note || f.category)}</span>`).join('');
      roundsHtml += `<div style="padding:10px 12px;margin-bottom:6px;background:var(--bg);border:0.5px solid var(--border);border-radius:8px;font-size:12.5px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
          <div style="font-weight:700;">${title} · ${new Date(r.inspected_at).toLocaleDateString('ko-KR')}</div>
          <div style="font-size:11px;color:var(--text-tertiary);">${Number(r.mileage_km).toLocaleString('ko-KR')} km</div>
        </div>
        <div style="color:var(--text-secondary);margin-bottom:4px;">RTD ${rtdSummary}</div>
        <div style="color:var(--text-secondary);">사진 ${rPhotos.length}장${feedbackTags ? ' · ' + feedbackTags : ''}</div>
        ${r.notes ? `<div style="margin-top:4px;color:var(--text-tertiary);font-style:italic;">${escapeHtmlAdm(r.notes)}</div>` : ''}
      </div>`;
    }

    document.getElementById('ppmoDetailContent').innerHTML = infoHtml + roundsHtml;
  } catch(e) {
    document.getElementById('ppmoDetailContent').innerHTML = `<div class="empty-state">불러오기 실패: ${e.message}</div>`;
  }
};

window.deletePpmoVehicle = async function(vehicleId, vehicleNo) {
  const roundIds = ppmoRounds.filter(r => r.vehicle_id === vehicleId).map(r => r.id);
  let photoCount = 0;
  if (roundIds.length) {
    const { data: cnt } = await _supabase.from('ppmo_photos').select('id', { count: 'exact', head: true }).in('round_id', roundIds);
    photoCount = cnt || 0;
  }
  const msg = `정말 삭제할까요?\n\n차량: ${vehicleNo}\n회차: ${roundIds.length}건\n사진 등: 함께 삭제됨\n\n※ 이 작업은 되돌릴 수 없습니다.`;
  if (!confirm(msg)) return;
  try {
    // 1. Storage 사진 파일 삭제
    if (roundIds.length) {
      const { data: photos } = await _supabase.from('ppmo_photos').select('url').in('round_id', roundIds);
      if (photos && photos.length) {
        const paths = photos.map(p => {
          const m = p.url && p.url.match(/\/ppmo-photos\/(.+)$/);
          return m ? m[1] : null;
        }).filter(Boolean);
        if (paths.length) {
          const { error: rmErr } = await _supabase.storage.from('ppmo-photos').remove(paths);
          if (rmErr) console.warn('사진 파일 일부 삭제 실패 (계속 진행):', rmErr.message);
        }
      }
    }
    // 2. Vehicle 삭제 (CASCADE로 rounds → measurements/photos/feedback 자동 삭제)
    const { error } = await _supabase.from('ppmo_vehicles').delete().eq('id', vehicleId);
    if (error) throw error;
    alert(`차량 ${vehicleNo} 삭제 완료`);
    await loadPpmoData();
  } catch(e) {
    alert('삭제 실패: ' + e.message + '\n\n※ RLS 정책 확인 필요 시 관리자에게 문의');
  }
};

window.exportPpmoCSV = function() {
  const progressMap = {};
  const lastDateMap = {};
  ppmoRounds.forEach(r => {
    progressMap[r.vehicle_id] = (progressMap[r.vehicle_id] || 0) + 1;
    const t = r.inspected_at ? new Date(r.inspected_at).getTime() : 0;
    if (!lastDateMap[r.vehicle_id] || t > lastDateMap[r.vehicle_id]) lastDateMap[r.vehicle_id] = t;
  });
  const headers = ['차량번호','담당자','모델','연식','제품','사이즈','하중지수','속도지수','장착주행거리','진행회차','최근검사일','등록일'];
  const rows = ppmoVehicles.map(v => [
    v.vehicle_no, v.created_by || '', v.vehicle_type || '', v.model_year || '',
    v.product || '', v.tire_size || '', v.load_index || '', v.speed_index || '',
    v.initial_mileage_km || '', (progressMap[v.id] || 0) + '/' + TOTAL_PPMO_ROUNDS,
    lastDateMap[v.id] ? new Date(lastDateMap[v.id]).toLocaleDateString('ko-KR') : '',
    v.created_at ? new Date(v.created_at).toLocaleDateString('ko-KR') : ''
  ]);
  const csv = [headers, ...rows].map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `ppmo_vehicles_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
};

function escapeHtmlAdm(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s) { return String(s ?? '').replace(/'/g, "\\'").replace(/"/g, '&quot;'); }
