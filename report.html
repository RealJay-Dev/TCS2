<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPMo Report</title>
<style>
  :root {
    --o: #FF9F00; --o-d: #D98500; --ink: #161616; --ink2: #4b4b4b; --ink3: #8d8d8d; --rule: #e3e3e3; --rule2: #cfcfcf;
    --bg: #ffffff; --tint: #f7f7f5; --ok: #2f7d32; --warn: #c77700; --bad: #b3261e; --ev: #2b6cb0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Pretendard', -apple-system, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; color: var(--ink); background: var(--bg); font-size: 13px; line-height: 1.5; }
  .num { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }
  .bar { height: 4px; background: var(--o); }
  .page { max-width: 1200px; margin: 0 auto; padding: 0 32px 64px; }
  .mast { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; padding: 28px 0 18px; border-bottom: 2px solid var(--ink); }
  .mast .brand { font-size: 11px; font-weight: 700; letter-spacing: .14em; color: var(--o-d); margin-bottom: 6px; }
  .mast h1 { font-size: 27px; font-weight: 700; letter-spacing: -.01em; }
  .mast .cap-prod { font-size: 12.5px; color: var(--ink2); margin-top: 6px; line-height: 1.6; max-width: 760px; }
  .mast .cap-prod .sw { margin-right: 4px; }
  .mast .cap-prod span.it { white-space: nowrap; margin-right: 14px; }
  .mast .meta { text-align: right; font-size: 12px; color: var(--ink2); line-height: 1.7; white-space: nowrap; }
  .mast .meta b { color: var(--ink); font-weight: 600; }
  .tools { display: flex; gap: 6px; justify-content: flex-end; margin-bottom: 6px; }
  .tool { border: 1px solid var(--rule2); background: var(--bg); padding: 4px 10px; font-size: 11.5px; cursor: pointer; color: var(--ink2); }
  .tool.on { border-color: var(--ink); color: var(--ink); font-weight: 700; }
  .controls { position: sticky; top: 0; z-index: 20; background: var(--tint); border-bottom: 1px solid var(--rule); margin: 0 -32px; padding: 12px 32px; display: grid; grid-template-columns: 1fr auto auto auto; gap: 28px; align-items: start; }
  .ctl-l { font-size: 11px; font-weight: 700; color: var(--ink3); margin-bottom: 6px; }
  .prods { display: grid; grid-template-columns: repeat(2, max-content); gap: 5px 22px; }
  .prod { display: flex; align-items: center; gap: 6px; font-size: 12.5px; cursor: pointer; user-select: none; white-space: nowrap; line-height: 18px; }
  .prod input { width: 15px; height: 15px; margin: 0; accent-color: var(--ink); cursor: pointer; flex-shrink: 0; }
  .prod .sw { margin: 0; flex-shrink: 0; }
  .prod.off { color: var(--ink3); }
  .seg { display: inline-flex; border: 1px solid var(--rule2); background: var(--bg); }
  .seg button { border: none; border-right: 1px solid var(--rule2); background: none; padding: 5px 11px; font-size: 12px; cursor: pointer; color: var(--ink2); min-width: 34px; }
  .seg button:last-child { border-right: none; }
  .seg button.on { background: var(--ink); color: #fff; font-weight: 700; }
  .seg button:disabled { color: #c9c9c9; cursor: not-allowed; }
  .hint { font-size: 10.5px; color: var(--ink3); margin-top: 4px; }
  .banner { margin-top: 14px; padding: 10px 14px; font-size: 12.5px; background: #fff6e0; color: #7a5200; border-left: 3px solid var(--o); }
  .banner.ok { background: #eef6ea; color: #2f5f22; border-left-color: var(--ok); }
  .banner button { margin-left: 10px; border: 1px solid currentColor; background: none; color: inherit; padding: 2px 8px; font-size: 12px; cursor: pointer; }
  .kpis { display: grid; grid-template-columns: repeat(6, 1fr); border-bottom: 1px solid var(--rule); margin-top: 22px; }
  .kpi { padding: 4px 18px 16px; border-left: 1px solid var(--rule); }
  .kpi:first-child { border-left: none; padding-left: 0; }
  .kpi .k { font-size: 11px; color: var(--ink3); font-weight: 600; }
  .kpi .v { font-size: 25px; font-weight: 700; margin-top: 2px; letter-spacing: -.01em; }
  .kpi .s { font-size: 11px; color: var(--ink2); }
  .kpi.hl .v { color: var(--o-d); }
  .sec { padding-top: 34px; break-inside: avoid; }
  .sec-h { display: flex; align-items: baseline; gap: 12px; border-top: 1px solid var(--ink); padding-top: 10px; margin-bottom: 16px; }
  .sec-n { font-size: 12px; font-weight: 700; color: var(--o-d); font-variant-numeric: tabular-nums; }
  .sec-t { font-size: 17px; font-weight: 700; }
  .sec-d { font-size: 11.5px; color: var(--ink3); margin-left: auto; }
  .sub-h { font-size: 13px; font-weight: 700; margin: 22px 0 8px; }
  .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  .g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px 28px; }
  .g6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px 10px; }
  table.t { width: 100%; border-collapse: collapse; }
  table.t th { text-align: left; font-size: 11px; font-weight: 600; color: var(--ink3); padding: 6px 8px; border-bottom: 1px solid var(--ink); white-space: nowrap; }
  table.t td { padding: 7px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
  table.t td.r, table.t th.r { text-align: right; }
  table.t tr.grp td { background: var(--tint); font-size: 11.5px; font-weight: 700; color: var(--ink2); padding: 5px 8px; }
  .sw { display: inline-block; width: 9px; height: 9px; margin-right: 6px; }
  .pt { display: inline-block; font-size: 10px; font-weight: 700; padding: 0 5px; border: 1px solid var(--rule2); color: var(--ink2); margin-left: 6px; }
  .pt.ev { border-color: var(--ev); color: var(--ev); }
  .kr { display: inline-block; font-size: 9.5px; font-weight: 700; color: var(--ink3); border: 1px solid var(--rule2); padding: 0 3px; margin-left: 5px; vertical-align: 1px; }
  .muted { color: var(--ink3); }
  .small { font-size: 11.5px; }
  .lvl { font-size: 11px; font-weight: 700; }
  .lvl.hi { color: var(--ok); } .lvl.mid { color: var(--warn); } .lvl.lo { color: var(--bad); }
  .best { font-size: 10px; font-weight: 700; color: var(--o-d); border: 1px solid var(--o); padding: 0 4px; margin-left: 6px; }
  ol.sum { padding-left: 18px; }
  ol.sum li { font-size: 13.5px; line-height: 1.75; margin-bottom: 4px; padding-left: 4px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 11.5px; color: var(--ink2); margin-top: 6px; }
  .legend i { display: inline-block; width: 16px; height: 3px; margin-right: 5px; vertical-align: 3px; }
  .note { font-size: 11.5px; color: var(--ink3); margin-top: 8px; line-height: 1.6; }
  .ph { background: var(--tint); border: 1px dashed var(--rule2); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: var(--ink3); font-size: 11px; aspect-ratio: 4 / 3; padding: 6px; }
  .ph b { color: var(--ink2); font-weight: 600; font-size: 11.5px; }
  .ph.img { padding: 0; border: 1px solid var(--rule); overflow: hidden; }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cap { font-size: 11px; color: var(--ink2); margin-top: 4px; }
  .veh { padding: 18px 0 20px; border-bottom: 1px solid var(--rule); break-inside: avoid; }
  .veh-h { display: flex; gap: 14px; align-items: baseline; margin-bottom: 10px; }
  .veh-h b { font-size: 15px; }
  .veh-body { display: grid; grid-template-columns: 210px 1fr; gap: 24px; }
  .veh-photos { display: grid; gap: 8px; align-content: start; }
  .al-card { border-top: 1px solid var(--rule2); padding-top: 8px; }
  .al-h { font-size: 13px; font-weight: 700; }
  .al-s { font-size: 11px; color: var(--ink3); }
  .comments { columns: 2; column-gap: 28px; }
  .cm { break-inside: avoid; margin-bottom: 18px; }
  .cm-h { font-size: 12.5px; font-weight: 700; margin-bottom: 4px; }
  .cm-cnt { font-size: 11px; color: var(--ink3); font-weight: 400; margin-left: 6px; }
  .cm-grp { font-size: 11px; font-weight: 700; margin: 8px 0 3px; }
  .cm-grp.pos { color: var(--ok); } .cm-grp.neg { color: var(--bad); } .cm-grp.neu { color: var(--ink3); }
  .cm li { list-style: none; font-size: 12px; color: var(--ink2); padding: 3px 0 3px 10px; border-left: 2px solid var(--rule); margin-bottom: 3px; }
  .cm li.pos { border-left-color: var(--ok); } .cm li.neg { border-left-color: var(--bad); }
  .cm li span { color: var(--ink3); font-size: 11px; margin-right: 6px; }
  ul.read li { font-size: 12px; color: var(--ink2); margin: 0 0 5px 16px; }
  .disc { font-size: 11px; color: var(--ink3); margin-top: 12px; line-height: 1.7; }
  .loading { position: fixed; inset: 0; background: #fff; z-index: 50; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px; font-size: 14px; color: var(--ink2); text-align: center; padding: 24px; }
  @media print {
    .controls, .tools, .banner button { display: none; }
    .page { max-width: none; padding: 0; }
    .sec { break-inside: auto; }
    .veh, .al-card, table.t tr { break-inside: avoid; }
    @page { size: A4 landscape; margin: 12mm; }
  }
</style>
</head>

    <div class="legend" style="margin-top:12px"><span><i style="background:var(--ok)"></i><span data-i="alOk"></span></span><span><i style="background:var(--warn)"></i><span data-i="alWarn"></span></span><span><i style="background:var(--bad)"></i><span data-i="alBad"></span></span></div>

<!--PPMO_DATA-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" id="sbLib"></script>
<script>
// ═══════════════ 설정 ═══════════════
// 두 가지 모드
//  1) 라이브: admin [리포트 생성] → 관리자 세션으로 데이터·사진을 불러와 '독립 HTML'을 만들어 다운로드
//  2) 독립 파일: 다운로드한 파일. 데이터와 사진이 파일 안에 들어 있어 로그인·인터넷 없이 열림
const SUPABASE_URL = 'https://thosddtgtffapakvmrhn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_HmrBU9WFhkCTM_TquLM31g_IPovXtXm';
const ADMIN_EMAILS = ['jaehong.park@continental.com', 'sangyong.2.jung@continental.com'];
const EMBED = window.__PPMO_DATA__ || null;
const _supabase = (!EMBED && typeof supabase !== 'undefined')
  ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storage: window.sessionStorage, persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } })
  : null;
const DAY = 86400000;
const POSMAP = { '1축-좌': 'FL', '1축-우': 'FR', '2축-좌외': 'RLo', '2축-좌내': 'RLi', '2축-우외': 'RRo', '2축-우내': 'RRi' };
const FRONT_POS = ['FL', 'FR'], ALL_POS = ['FL', 'FR', 'RLo', 'RLi', 'RRo', 'RRi'];
const CONTI_COLORS = ['#FF9F00', '#B86E00', '#F2C66E', '#D9A400', '#8A5A00'];
const COMP_COLORS = ['#4F6175', '#8E5A86', '#6F8A6E', '#9A9A9A', '#2F4858'];
const ENV_KO = ['고속도로 주행 위주', '시내 주행 위주', '고속도로 위주 + 시내 복합', '시내 위주 + 고속도로 복합'];
const ENV_EN = ['Mostly highway', 'Mostly city', 'Highway + some city', 'City + some highway'];
const PRIO_KO = ['구매 가격', '타이어 수명(마일리지)', '마른노면 성능', '젖은노면 성능', '소음 성능', '연비', '외관'];
const PRIO_EN = ['Price', 'Tire life', 'Dry', 'Wet', 'Noise', 'Fuel economy', 'Appearance'];
const LOAD_KO = ['최대 적재하중 대비 가벼운 편', '최대 적재하중에 근접하는 편', '최대 적재하중보다 무거운 편'];
const LOAD_EN = ['Below max load', 'Near max load', 'Above max load'];
const REPORT_PHOTO_TYPES = ['front', 'rtd_1', 'rtd_2'];
let PRODUCTS = [], VEH = [], MAXR = 0, GENERATED_AT = Date.now();
const msg = t => { const el = document.getElementById('loadMsg'); if (el) el.textContent = t; };

// ═══════════════ 라이브 모드: 데이터 수집 ═══════════════
async function fetchAll(table, build) {
  const out = []; const size = 1000;
  for (let from = 0; ; from += size) {
    const { data, error } = await build(_supabase.from(table).select('*')).range(from, from + size - 1);
    if (error) throw new Error(`[${table}] ${error.message}`);
    out.push(...(data || []));
    if (!data || data.length < size) break;
  }
  return out;
}
const pathOf = u => !u ? null : (u.startsWith('http') ? ((u.match(/\/ppmo-photos\/(.+?)(\?|$)/) || [])[1] || null) : u);
// 사진을 줄여서 data URI로 (독립 파일에 포함)
async function toDataUri(url, maxDim = 900, q = 0.7) {
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const bmp = await createImageBitmap(await res.blob());
  let { width: w, height: h } = bmp;
  if (w > maxDim || h > maxDim) { if (w >= h) { h = Math.round(h * maxDim / w); w = maxDim; } else { w = Math.round(w * maxDim / h); h = maxDim; } }
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').drawImage(bmp, 0, 0, w, h);
  return c.toDataURL('image/jpeg', q);
}
async function collectLive() {
  const { data: { session } } = await _supabase.auth.getSession();
  if (!session || !ADMIN_EMAILS.includes(session.user.email.toLowerCase())) {
    throw new Error('관리자 로그인이 필요합니다. admin 페이지의 PPMo 탭에서 [리포트 생성] 버튼으로 열어 주세요.');
  }
  msg('차량 · 회차 데이터 불러오는 중...');
  const T = {};
  T.vehicles = await fetchAll('ppmo_vehicles', q => q.order('created_at'));
  T.rounds = await fetchAll('ppmo_rounds', q => q);
  T.meas = await fetchAll('ppmo_measurements', q => q);
  T.photos = (await fetchAll('ppmo_photos', q => q.in('photo_type', REPORT_PHOTO_TYPES))).map(p => ({ round_id: p.round_id, photo_type: p.photo_type, path: pathOf(p.url) })).filter(p => p.path);
  T.surveys = await fetchAll('ppmo_survey', q => q.order('created_at', { ascending: false }));
  T.aligns = await fetchAll('ppmo_alignment', q => q.eq('phase', 'initial'));
  T.rots = await fetchAll('ppmo_rotations', q => q);
  T.dfb = []; T.road = [];
  try { T.dfb = await fetchAll('ppmo_driver_feedback', q => q); } catch (e) { console.warn(e.message); }
  try { T.road = await fetchAll('ppmo_road_photos', q => q.order('created_at')); } catch (e) { console.warn(e.message); }
  // 사진: 서명 URL → 축소 → data URI
  const paths = [...new Set([...T.photos.map(p => p.path), ...T.road.map(r => r.path)])];
  const signedMap = {};
  for (let i = 0; i < paths.length; i += 100) {
    const { data } = await _supabase.storage.from('ppmo-photos').createSignedUrls(paths.slice(i, i + 100), 3600);
    (data || []).forEach(x => { if (x.path && x.signedUrl) signedMap[x.path] = x.signedUrl; });
  }
  const urls = {}; let done = 0, fail = 0;
  const queue = paths.filter(p => signedMap[p]);
  const worker = async () => {
    while (queue.length) {
      const p = queue.shift();
      try { urls[p] = await toDataUri(signedMap[p]); } catch (e) { fail++; console.warn('사진 변환 실패', p, e.message); }
      done++; msg(`사진 포함 중... ${done}/${paths.length}`);
    }
  };
  await Promise.all(Array.from({ length: 6 }, worker));
  return { tables: T, urls, generatedAt: Date.now(), photoFail: fail };
}
// 독립 HTML 만들기: 현재 파일 원본 + 데이터 삽입 + Supabase 라이브러리 제거
async function buildStandalone(pkg) {
  const src = await (await fetch(location.pathname, { cache: 'no-store' })).text();
  const json = JSON.stringify(pkg).replace(/</g, '\\u003c').replace(/\u2028/g, '\\u2028').replace(/\u2029/g, '\\u2029');
  return src
    .replace(/<script src="https:\/\/cdn\.jsdelivr\.net\/npm\/@supabase\/supabase-js@2" id="sbLib"><\/script>/, '')
    .replace('<!--PPMO_DATA-->', `<script>window.__PPMO_DATA__=${json};<\/script>`);
}
let _standaloneUrl = null, _standaloneName = '';
function downloadStandalone() {
  const a = document.createElement('a'); a.href = _standaloneUrl; a.download = _standaloneName;
  document.body.appendChild(a); a.click(); a.remove();
}

// ═══════════════ 데이터 → 리포트 모델 ═══════════════
function buildModel(pkg) {
  const { vehicles, rounds, meas, photos, surveys, aligns, rots, dfb, road } = pkg.tables;
  const urls = pkg.urls || {};
  GENERATED_AT = pkg.generatedAt || Date.now();
  const pk = v => `${v.product || '—'}|${v.tire_size || ''}`;
  const keys = [...new Set(vehicles.map(pk))];
  const isConti = name => /vancontact|continental|conti/i.test(name || '');
  let ci = 0, xi = 0;
  PRODUCTS = keys.map(k => { const [name, size] = k.split('|'); return { id: k, name, size: (size || '').replace(/\s*\d+PR$/i, ''), ply: ((size || '').match(/\d+PR$/i) || [''])[0], conti: isConti(name) }; })
    .sort((a, b) => (b.conti - a.conti) || (a.conti ? b.name.localeCompare(a.name) : a.name.localeCompare(b.name)) || b.size.localeCompare(a.size))
    .map(p => ({ ...p, color: p.conti ? CONTI_COLORS[ci++ % CONTI_COLORS.length] : COMP_COLORS[xi++ % COMP_COLORS.length] }));
  VEH = vehicles.map(v => {
    const vr = rounds.filter(r => r.vehicle_id === v.id).sort((a, b) => a.round_no - b.round_no);
    const gc = v.groove_count || 3;
    const gkeys = Array.from({ length: gc }, (_, i) => `groove_${i + 1}`);
    const vrot = rots.filter(x => x.vehicle_id === v.id);
    const rno = Object.fromEntries(vr.map(r => [r.id, r.round_no]));
    // 회차 n 측정 시점의 { 현재 위치 → 타이어(최초 위치) }  (RTD는 위치교환 전 측정)
    const tireAt = n => {
      const cur = Object.fromEntries(Object.keys(POSMAP).map(p => [p, p]));
      vrot.filter(x => rno[x.round_id] != null && rno[x.round_id] < n).sort((a, b) => rno[a.round_id] - rno[b.round_id]).forEach(x => { cur[x.tire_key] = x.to_position; });
      const at = {}; Object.entries(cur).forEach(([k, p]) => { at[p] = k; }); return at;
    };
    const rs = [];
    vr.forEach(r => {
      const rm = meas.filter(m => r.id === m.round_id);
      if (!rm.length) return;
      const at = tireAt(r.round_no), m = {};
      Object.keys(POSMAP).forEach(dbPos => {
        let vals = gkeys.map(g => rm.find(x => x.position === dbPos && x.point === g)?.rtd_mm);
        if (vals.every(x => x == null)) vals = ['outer', 'center', 'inner'].map(g => rm.find(x => x.position === dbPos && x.point === g)?.rtd_mm);
        if (vals.some(x => x == null || isNaN(Number(x)))) return;
        m[POSMAP[at[dbPos] || dbPos]] = vals.map(Number);
      });
      const odo = r.round_no === 0 ? (v.initial_mileage_km ?? r.mileage_km) : r.mileage_km;
      if (odo == null) return;
      const ph = {};
      photos.filter(p => p.round_id === r.id).forEach(p => { ph[p.photo_type] = urls[p.path] || null; });
      rs.push({ no: r.round_no, date: new Date(r.inspected_at).getTime(), odo: Number(odo), m, ph, notes: r.notes });
    });
    if (rs.length && rs[0].no !== 0) rs.length = 0;   // 장착(0회차) 데이터가 없으면 마모 계산 불가
    const sv = surveys.find(s => s.vehicle_id === v.id) || {};
    const al = {};
    aligns.filter(a => a.vehicle_id === v.id).forEach(a => { al[a.wheel] = { c: Number(a.camber_deg), k: a.caster_deg != null ? Number(a.caster_deg) : null, t: Number(a.toe_deg) }; });
    const toeUnit = (aligns.find(a => a.vehicle_id === v.id && a.toe_unit) || {}).toe_unit || 'deg';
    const fb = (dfb || []).filter(d => d.vehicle_id === v.id).map(d => {
      const rr = vr.find(r => r.id === d.round_id) || {};
      return { ...d, round: rr.round_no, note: rr.notes || null };
    }).filter(f => f.round != null);
    return {
      id: v.id, no: v.vehicle_no, model: v.vehicle_type || '', drive: v.drive_type || null, pt: v.powertrain || 'NA',
      prod: pk(v), frontOnly: !!v.front_only, pos: v.front_only ? FRONT_POS : ALL_POS, groove: gc, rounds: rs,
      region: sv.route_region || '', roads: sv.route_roads || '', env: sv.driving_env || '', prio: sv.priorities || [], load: sv.load_level || '',
      prev: [sv.prev_brand, sv.prev_product].filter(Boolean).join(' '), fb, align: al, toeUnit,
      road: (road || []).filter(x => x.vehicle_id === v.id).map(x => ({ url: urls[x.path] || null, caption: x.caption || '' }))
    };
  });
  MAXR = Math.max(0, ...VEH.map(v => v.rounds.length ? v.rounds[v.rounds.length - 1].no : 0));
}

function stats(pid, ptOverride) {

      tires++;

  document.getElementById('routeTbl').innerHTML = `<table class="t"><tr><th>${T('plateCol')}</th><th>${T('regionCol')}</th><th>${T('roadsCol')}</th><th>${T('envCol')}</th><th>${T('loadCol')}</th><th>${T('prioCol')}</th><th class="r">${T('dailyCol')}</th></tr>${
    vs.map(v => { const dk = dailyKm(v); return `<tr><td><b>${esc(v.no)}</b>${ptTag(v.pt)}<div class="muted small">${esc(trKo(v.model))}</div></td><td>${esc(trKo(v.region) || '—')}</td><td class="small">${esc(trKo(v.roads) || '—')}</td><td class="small">${esc(trEnv(v.env) || '—')}</td><td class="small">${esc(trLoad(v.load) || '—')}</td><td class="small">${esc(v.prio.map(trPrio).join(', ') || '—')}</td><td class="r num">${dk ? fmt(dk) : '—'}</td></tr>`; }).join('')}</table>`;
  document.getElementById('routePhotos').innerHTML = vs.map(v => {
    const r = v.road[0];
    return `<div>${r && r.url ? `<div class="ph img"><img src="${r.url}"></div>` : `<div class="ph"><b>${T('phRoad')}</b>${T('phAdmin')}</div>`}<div class="cap"><b>${esc(v.no)}</b> · ${esc(trKo(r?.caption || v.region || ''))}${v.road.length > 1 ? ` (+${v.road.length - 1})` : ''}</div></div>`;
  }).join('');

  // 04 마모 곡선
  document.getElementById('wearChart').innerHTML = S.length ? wearChart(S) : `<div class="note">${T('noData')}</div>`;
  document.getElementById('wearLegend').innerHTML = S.map(s => `<span><i style="background:${s.p.color}"></i>${esc(pl(s.p))}</span>`).join('');
  document.getElementById('wearTbl').innerHTML = S.length ? `<table class="t"><tr><th>${T('prodCol')}</th><th class="r">${T('vehCol')}</th><th class="r">${T('tireCol')}</th><th class="r">${T('kmCol')}</th><th class="r">${T('lifeCol')} (${F.limit} mm)</th><th class="r">${T('monthCol')}</th><th>${T('confCol')}</th></tr>${
    [...S].sort((a, b) => (b.life || 0) - (a.life || 0)).map(s => `<tr><td><span class="sw" style="background:${s.p.color}"></span><b>${esc(pl(s.p))}</b>${s === bc ? `<span class="best">${T('best')}</span>` : ''}</td><td class="r num">${s.vs.length}</td><td class="r num">${s.tires}</td><td class="r num">${fmt(s.kmMax)}</td><td class="r num"><b>${s.life ? fmt(s.life) : '—'}</b></td><td class="r num">${s.months ? fmt(s.months) : '—'}</td><td><span class="lvl ${s.conf}">${T(s.conf)}</span></td></tr>`).join('')}</table>` : '';
  document.getElementById('confNote').textContent = T('conf');

  // 05 내연 vs EV
  document.getElementById('ptChart').innerHTML = PTR.length ? ptChart(PTR) : `<div class="note">${T('noData')}</div>`;
  const lc = s => s ? `<td class="r num">${s.life ? fmt(s.life) : '—'}<div class="muted small">${s.tires}${LANG === 'ko' ? '본' : ' tires'} · <span class="lvl ${s.conf}">${T(s.conf)}</span></div></td>` : '<td class="r muted">—</td>';
  document.getElementById('ptTbl').innerHTML = PTR.length ? `<table class="t"><tr><th>${T('prodCol')}</th><th class="r">${T('ICE')}</th><th class="r">${T('EV')}</th><th class="r">${T('diffCol')}</th></tr>${
    PTR.map(r => { const d = r.ice?.life && r.ev?.life ? Math.round((r.ev.life / r.ice.life - 1) * 100) : null;
      return `<tr><td><span class="sw" style="background:${r.p.color}"></span><b>${esc(r.p.name)}</b> <span class="muted small">${esc(r.p.size)}</span></td>${lc(r.ice)}${lc(r.ev)}<td class="r num" style="font-weight:700;color:${d == null ? '#8d8d8d' : d < 0 ? '#b3261e' : '#2f7d32'}">${d == null ? '—' : (d > 0 ? '+' : '') + d + '%'}</td></tr>`; }).join('')}</table>` : '';

  // 06 프로파일
  const shapeSub = s => ({ t: T(s), c: s === 'even' ? '#2f7d32' : '#c77700' });
  document.getElementById('profiles').innerHTML = S.filter(s => s.prof.length).map(s => grooveChart(pl(s.p), shapeSub(s.shape), s.prof.map(p => ({ label: p.r === 0 ? T('init') : 'R' + p.r, g: p.g })), s.p.color)).join('');
  document.getElementById('vehDetail').innerHTML = vs.map(v => {
    const p = P(v.prod), rs = vRounds(v), last = rs[rs.length - 1], pos = vPos(v);
    if (rs.length < 2) return `<div class="veh"><div class="veh-h"><b>${esc(v.no)}</b><span>${esc(trKo(v.model))}${ptTag(v.pt)} · ${esc(pl(p))}</span><span class="muted">${T('noData')}</span></div></div>`;
    const rdLabel = 'R' + last.no;
    const charts = pos.filter(ps => rs.filter(r => r.m[ps]).length > 1).map(ps => {
      const prs = rs.filter(r => r.m[ps]);
      const w = minD(prs[0].m[ps]) - minD(prs[prs.length - 1].m[ps]);
      return `<div>${grooveChart(T('pos')[ps], { t: `${T('worn')} ${w.toFixed(1)} mm · ${Math.round(w / minD(prs[0].m[ps]) * 100)}%`, c: '#4b4b4b' }, prs.map(r => ({ label: r.no === 0 ? T('init') : 'R' + r.no, g: r.m[ps] })), p.color, { w: 330, h: 200 })}
        <table class="t small" style="margin-top:4px"><tr><th></th><th class="r">km</th>${gLabels(v.groove).map(g => `<th class="r">${g}</th>`).join('')}<th class="r">${T('min')}</th></tr>${prs.map(r => `<tr><td>${r.no === 0 ? T('init') : 'R' + r.no} <span class="muted">${dstr(r.date)}</span></td><td class="r num">${fmt(r.odo - rs[0].odo)}</td>${r.m[ps].map(d => `<td class="r num">${d.toFixed(1)}</td>`).join('')}<td class="r num"><b>${minD(r.m[ps]).toFixed(1)}</b></td></tr>`).join('')}</table></div>`;
    }).join('');
    const ph = last.ph || {};
    return `<div class="veh"><div class="veh-h"><b>${esc(v.no)}</b><span>${esc(trKo(v.model))}${ptTag(v.pt)} · <span class="sw" style="background:${p.color}"></span>${esc(pl(p))}</span><span class="muted">${fmt(last.odo - rs[0].odo)} km · ${rdLabel} ${dstr(last.date)}</span></div>
      <div class="veh-body"><div class="veh-photos">${photoBox(ph.front, T('phVeh'), rdLabel)}${photoBox(ph.rtd_1, T('phL'), rdLabel)}${photoBox(ph.rtd_2, T('phR'), rdLabel)}</div>
      <div style="display:grid;grid-template-columns:repeat(${Math.min(pos.length, 2)},1fr);gap:24px">${charts}</div></div></div>`;
  }).join('');

  // 07 얼라인먼트
  document.getElementById('alignCards').innerHTML = vs.map(v => {
    const p = P(v.prod), al = v.align;
    if (!Object.keys(al).length) return `<div class="al-card"><div class="al-h">${esc(v.no)}${ptTag(v.pt)}</div><div class="al-s">${T('noAlign')}</div></div>`;
    const cs = ['FL', 'FR'].map(w => al[w]?.k).filter(x => x != null && !isNaN(x));
    return `<div class="al-card"><div class="al-h">${esc(v.no)}${ptTag(v.pt)}</div><div class="al-s">${esc(trKo(v.model))} · ${esc(pl(p))}${cs.length ? ` · ${T('caster')} ${cs.map(c => c.toFixed(2) + '°').join(' / ')}` : ''}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px"><div>${frontView(al, 'F')}<div class="cap" style="text-align:center">${T('frontView')}</div>${al.RL || al.RR ? frontView(al, 'R') + `<div class="cap" style="text-align:center">${T('rearView')}</div>` : ''}</div><div>${topView(al, v.toeUnit)}<div class="cap" style="text-align:center">${T('topView')} (${v.toeUnit === 'mm' ? 'mm' : '°'})</div></div></div></div>`;
  }).join('');

  // 08 피드백
  document.getElementById('fbChart').innerHTML = S.some(s => s.fb.n) ? fbChart(S) : `<div class="note">${T('noData')}</div>`;
  const cell = (v, n, tot) => v == null ? `<td class="r muted">—</td>` : `<td class="r num" style="color:${n < 3 ? '#9a9a9a' : v >= 3.5 ? '#2f7d32' : v < 2.5 ? '#b3261e' : '#161616'};font-weight:700">${v.toFixed(1)}${tot != null ? ` <span class="muted small" style="font-weight:400">(${n}/${tot})</span>` : ''}</td>`;
  document.getElementById('fbTbl').innerHTML = `<table class="t"><tr><th>${T('prodCol')}</th><th class="r">${T('wet')}</th><th class="r">${T('dry')}</th><th class="r">${T('comfort')}</th><th class="r">${T('fuel')}</th><th>${T('prevCol')}</th></tr>${
    S.map(s => `<tr><td><span class="sw" style="background:${s.p.color}"></span><b>${esc(s.p.name)}</b> <span class="muted small">${esc(s.p.size)}</span></td>${FB4.map(k => cell(s.fb[k], s.fb[k + '_n'])).join('')}<td class="small">${esc([...new Set(s.vs.map(v => trKo(v.prev)).filter(Boolean))].join(', ') || '—')}</td></tr>`).join('')}</table>`;
  const ok = ['puncture', 'cut', 'impact', 'stone', 'appearance'];
  document.getElementById('fbOther').innerHTML = `<table class="t"><tr><th></th>${S.map(s => `<th class="r"><span class="sw" style="background:${s.p.color}"></span>${esc(s.p.name.replace('VanContact ', 'VC '))} ${esc(s.p.size)}</th>`).join('')}</tr>${
    ok.map(k => `<tr><td>${T(k)}</td>${S.map(s => cell(s.fb[k], s.fb[k + '_n'], s.fb.n)).join('')}</tr>`).join('')}</table>`;
  document.getElementById('fbComments').innerHTML = S.map(commentsHtml).join('');

  document.getElementById('howto').innerHTML = T('howto').map(l => `<li>${l}</li>`).join('');
}
window.setLang = l => { LANG = l; render(); };

// ═══════════════ 시작 ═══════════════
(async () => {
  try {
    let pkg;
    if (EMBED) pkg = EMBED;
    else {
      if (!_supabase) throw new Error('Supabase 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.');
      pkg = await collectLive();
    }
    buildModel(pkg);
    PRODUCTS.forEach(p => F.prods.add(p.id));
    hasRear = VEH.some(v => !v.frontOnly);
    drives = [...new Set(VEH.map(v => v.drive).filter(Boolean))];
    pts = ['ICE', 'EV', 'NA'].filter(x => VEH.some(v => v.pt === x));
    if (!EMBED) {
      msg('리포트 파일 만드는 중...');
      const html = await buildStandalone(pkg);
      const d = new Date(pkg.generatedAt);
      const stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}_${String(d.getHours()).padStart(2, '0')}${String(d.getMinutes()).padStart(2, '0')}`;
      _standaloneName = `PPMo_Report_${stamp}.html`;
      _standaloneUrl = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
      window._photoFail = pkg.photoFail || 0;
      downloadStandalone();
    }
    render();
    document.getElementById('loading').style.display = 'none';
  } catch (e) {
    console.error(e);
    msg(e.message || String(e));
  }
})();
</script>
</body>
