<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>EoTC 문서 · TCS Korea</title>
<style>
  :root {
    --bg: #ffffff; --bg-secondary: #f5f5f4;
    --text: #1a1a18; --text-secondary: #5f5e5a; --text-tertiary: #888780;
    --border: rgba(0,0,0,0.12); --border-strong: rgba(0,0,0,0.25);
    --radius: 12px; --radius-sm: 8px;
    --text-info: #185fa5; --bg-info: #e6f1fb;
    --text-danger: #a32d2d; --bg-danger: #fcebeb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a; --bg-secondary: #2a2a28;
      --text: #f0ede8; --text-secondary: #b4b2a9; --text-tertiary: #888780;
      --border: rgba(255,255,255,0.1); --border-strong: rgba(255,255,255,0.22);
      --text-info: #b5d4f4; --bg-info: #042c53;
      --text-danger: #f7c1c1; --bg-danger: #501313;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; background: var(--bg-secondary); color: var(--text); height: 100vh; display: flex; flex-direction: column; }

  /* Auth */
  #authScreen { position: fixed; inset: 0; background: var(--bg-secondary); z-index: 200; display: flex; align-items: center; justify-content: center; }
  .auth-card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 28px 24px; width: 100%; max-width: 340px; text-align: center; }
  .auth-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .auth-sub { font-size: 13px; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.5; }
  .auth-btn { width: 100%; padding: 12px; background: var(--text); color: var(--bg); border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; cursor: pointer; }

  /* Header */
  .header { background: var(--bg); border-bottom: 0.5px solid var(--border); padding: 12px 16px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .back-btn { background: none; border: 0.5px solid var(--border-strong); border-radius: var(--radius-sm); padding: 6px 12px; font-size: 13px; color: var(--text-secondary); cursor: pointer; }
  .header-title { font-size: 15px; font-weight: 600; flex: 1; }
  .header-badge { font-size: 11px; font-weight: 600; background: var(--bg-danger); color: var(--text-danger); padding: 3px 8px; border-radius: 20px; white-space: nowrap; }

  /* Warning bar */
  .warning-bar { background: var(--bg-danger); color: var(--text-danger); font-size: 12px; font-weight: 600; text-align: center; padding: 7px 16px; flex-shrink: 0; letter-spacing: 0.3px; }

  /* PDF viewer */
  .pdf-wrap { flex: 1; overflow: hidden; }
  iframe { width: 100%; height: 100%; border: none; display: block; }

  .hidden { display: none; }
</style>
</head>
<body>

<!-- Auth screen -->
<div id="authScreen">
  <div class="auth-card">
    <div class="auth-title">🔒 로그인 필요</div>
    <div class="auth-sub">Continental 계정으로 로그인해야<br>이 문서를 열람할 수 있습니다.</div>
    <button class="auth-btn" onclick="location.href='index.html'">로그인 페이지로 이동</button>
  </div>
</div>

<!-- Main -->
<div id="mainContent" class="hidden" style="display:none;flex-direction:column;height:100vh;">
  <div class="header">
    <button class="back-btn" onclick="history.back()">← 뒤로</button>
    <div class="header-title">End of Tread Condition (EoTC) 참고 문서</div>
    <div class="header-badge">🔒 내부용</div>
  </div>
  <div class="warning-bar">⚠️ 본 문서는 Continental 내부용입니다 · 외부 유출 엄격 금지 · FOR INTERNAL USE ONLY</div>
  <div class="pdf-wrap">
    <iframe src="eotc-current.pdf" type="application/pdf"></iframe>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://thosddtgtffapakvmrhn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_HmrBU9WFhkCTM_TquLM31g_IPovXtXm';
const ALLOWED_DOMAIN = 'continental.com';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: false }
});

(async () => {
  const { data: { session } } = await _supabase.auth.getSession();
  if (session && session.user.email.endsWith('@' + ALLOWED_DOMAIN)) {
    document.getElementById('authScreen').style.display = 'none';
    const main = document.getElementById('mainContent');
    main.classList.remove('hidden');
    main.style.display = 'flex';
  }
})();
</script>
</body>
</html>
